version: 1.0
runtime: go1
build:
  commands:
    pre-build:
      - curl -OL https://go.dev/dl/go1.23.4.linux-amd64.tar.gz
      - rm -rf /root/.goenv/versions/1.18.10
      - tar -C /root/.goenv/versions -xzf go1.23.4.linux-amd64.tar.gz
      - mv /root/.goenv/versions/go /root/.goenv/versions/1.23.4
      - export PATH=/root/.goenv/versions/1.23.4/bin:$PATH
      - go version
    build:
      - export PATH=/root/.goenv/versions/1.23.4/bin:$PATH
      - go build -o electric-backend-server main.go
run:
  command: ./electric-backend-server
  network:
    port: 4000