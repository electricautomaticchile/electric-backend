version: 1.0
runtime: go1

build:
  commands:
    build:
      - go build -o electric-backend-server main.go
run:
  command: ./electric-backend-server
  network:
    port: 4000
  env:
    - name: GIN_MODE
      value: release
  healthcheck:
    path: /health
    interval: 10
    timeout: 5
    healthy_threshold: 2
    unhealthy_threshold: 3
