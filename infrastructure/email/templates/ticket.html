<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px 10px 0 0;
        }

        .content {
            background: #f9fafb;
            padding: 30px;
            border-radius: 0 0 10px 10px;
        }

        .ticket-box {
            background: white;
            border: 1px solid #e5e7eb;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            color: #6b7280;
            font-size: 12px;
        }

        .button {
            display: inline-block;
            background: #3b82f6;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 6px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🎫 Actualización de Ticket</h1>
        </div>
        <div class="content">
            <p>Hola <strong>{{.NombreUsuario}}</strong>,</p>
            <p>Hay una actualización en tu ticket de soporte:</p>
            <div class="ticket-box">
                <p><strong>Ticket:</strong> #{{.NumeroTicket}}</p>
                <p><strong>Asunto:</strong> {{.Asunto}}</p>
                <p><strong>Mensaje:</strong></p>
                <p>{{.Mensaje}}</p>
            </div>
            <a href="https://electricautomaticchile.com/cliente" class="button">Ver Ticket</a>
        </div>
        <div class="footer">
            <p>Electricautomaticchile - Soporte Técnico</p>
            <p>Este es un correo automático, por favor no responder.</p>
        </div>
    </div>
</body>

</html>
